# Netlify build configuration.
#
# Netlify detects Next.js and applies its OpenNext adapter automatically, which
# is what handles the server output, the proxy and the publish directory. Do not
# set `publish` here — the adapter configures it, and pinning it fights that.

[build]
  command = "npm run build"

[build.environment]
  # Next.js 16 requires Node 20.9+. Pinned so the build does not silently move
  # to a new major when Netlify updates its default image.
  NODE_VERSION = "22"

# Wallos's own stylesheets, fonts and images are static and content-addressed by
# path, so they can be cached hard. Next's own /_next/static assets are already
# fingerprinted and handled by the adapter.
[[headers]]
  for = "/webfonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# The stylesheets are served unversioned, so they get a short TTL with
# revalidation rather than a long immutable one — otherwise a design fix would
# not reach anyone who had already loaded the site.
[[headers]]
  for = "/styles/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
